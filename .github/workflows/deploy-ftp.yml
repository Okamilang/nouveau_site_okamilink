name: Deploy to IONOS via FTP

on:
  push:
    branches:
      - main # Le déploiement se lancera à chaque push sur la branche main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
      
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: 📦 Install Dependencies
        run: npm ci
        
      - name: 🏗️ Build Project
        run: npm run build
        
      - name: 🚀 Sync files to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./ # Modifiez ceci si vous voulez déployer dans un sous-dossier, ex: /nouveau_site_okamilink/
